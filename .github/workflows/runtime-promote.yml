name: Promote Runtime Release to Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Finalized runtime release ID, for example runtime-123456"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: runtime-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/dev'
    name: Promote selected runtime release to production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: foundry / prod
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
    steps:
      - name: Check out the fixed dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Check the dispatch ref and checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set the bounded release directory
        run: echo "RELEASE_DIRECTORY=$RUNNER_TEMP/runtime-release" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version

      - name: Validate the selected finalized release
        id: selected_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIRECTORY"
          python scripts/runtime_release.py promote --release-id "$RELEASE_ID"

      - name: Apply and verify the production pair
        env:
          HERMES_IMAGE: ${{ steps.selected_release.outputs.hermes_image }}
          RUNTIME_IMAGE: ${{ steps.selected_release.outputs.runtime_image }}
        run: |
          set -euo pipefail
          python scripts/integrations/railway/update_runtime_images.py \
            --environment production \
            --hermes-image "$HERMES_IMAGE" \
            --runtime-image "$RUNTIME_IMAGE" > "$RELEASE_DIRECTORY/receipt.json"

      - name: Summarize the verified production desired pair
        env:
          HERMES_IMAGE: ${{ steps.selected_release.outputs.hermes_image }}
          RUNTIME_IMAGE: ${{ steps.selected_release.outputs.runtime_image }}
        run: |
          {
            echo "## Runtime production promotion"
            echo
            echo "Release: $RELEASE_ID"
            echo
            echo '```text'
            echo "HERMES_IMAGE=$HERMES_IMAGE"
            echo "RUNTIME_IMAGE=$RUNTIME_IMAGE"
            echo '```'
            echo
            echo "Desired configuration was verified; machine adoption remains not verified."
            echo
            echo '### Previous and verified image pair'
            echo '```json'
            cat "$RELEASE_DIRECTORY/receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
