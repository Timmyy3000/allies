name: enkii review

on:
  # Use the trusted base workflow for PR reviews so branch-to-branch PRs can
  # be reviewed without executing a PR-modified workflow with the API key.
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Review release and development branch targets, including branch-to-branch PRs.
    branches:
      - dev
      - staging
      - prod
      - prod-fastlane
      - 'web/**'
      - 'mobile/**'
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write

concurrency:
  group: enkii-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    name: enkii review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@enkii')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      # Enkki reads the PR source but does not run repository scripts. The
      # workflow itself comes from the trusted base via pull_request_target.
      - name: Check out PR source for automatic review
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out repository for on-demand review
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run enkii
        uses: Timmyy3000/enkii@b7c43955489940fd809df72c22b413484f5c265e # v0.2
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # A non-empty path enables Enkii v0.2's policy-review lane.
          policy_review_skill_path: ".enkii/policy-review.md"
