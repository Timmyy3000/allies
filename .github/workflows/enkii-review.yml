name: enkii review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, staging, prod, prod-fastlane]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write

concurrency:
  group: enkii-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: enkii review
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: |
      github.event_name == 'pull_request'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@enkii')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run enkii
        uses: Timmyy3000/enkii@v0.2
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # A non-empty path enables Enkii v0.2's policy-review lane.
          policy_review_skill_path: ".enkii/policy-review.md"
