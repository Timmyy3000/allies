name: Publish Allies Runtime Image

on:
  push:
    branches:
      - chore/publish-runtime-image
    paths:
      - runtime/**
      - .github/workflows/publish-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish runtime image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: runtime
          file: runtime/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/allies-runtime:${{ github.sha }}

      - name: Report image reference
        run: |
          echo "Published image: ghcr.io/${{ github.repository_owner }}/allies-runtime@${{ steps.image.outputs.digest }}"
