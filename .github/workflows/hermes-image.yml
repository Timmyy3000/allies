name: Publish Allies Runtime Images

on:
  pull_request:
    paths:
      - "runtime/hermes-image/**"
      - "Makefile"
      - ".github/workflows/hermes-image.yml"
  workflow_dispatch:
    inputs:
      railway_environment:
        description: "Update Foundry shared variables after publishing"
        required: true
        default: none
        type: choice
        options:
          - none
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke-test production image
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      hermes_image: ${{ steps.publish_hermes.outputs.reference }}
      runtime_image: ${{ steps.publish_runtime.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Test provider policy boundary
        env:
          PYTHONPATH: runtime/hermes-image/provider
        run: uvx --from pytest==8.4.2 --with PyYAML==6.0.3 pytest runtime/hermes-image/provider/tests/test_provider.py runtime/hermes-image/tests -q
      - name: Prepare hash-locked offline wheelhouse
        run: make hermes-image-wheelhouse
      - name: Prove wheel hashes are enforced
        run: |
          cp -a runtime/hermes-image/wheelhouse /tmp/corrupt-wheelhouse
          printf 'corrupt' >> /tmp/corrupt-wheelhouse/mnemosyne_hermes-0.5.0-py3-none-any.whl
          if python runtime/hermes-image/verify_wheelhouse.py \
            runtime/hermes-image/requirements.lock /tmp/corrupt-wheelhouse; then
            echo "corrupted wheel unexpectedly passed hash verification" >&2
            exit 1
          fi
      - name: Build with provenance and SBOM
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --output type=oci,dest=/tmp/allies-hermes-mnemosyne.oci.tar \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --tag allies/hermes-mnemosyne:ci \
            --file runtime/hermes-image/Dockerfile \
            runtime/hermes-image
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --tag allies/hermes-mnemosyne:ci \
            --file runtime/hermes-image/Dockerfile \
            runtime/hermes-image
      - name: Assert provider import and inherited init
        run: |
          test "$(docker image inspect --format '{{.Config.Entrypoint}}' allies/hermes-mnemosyne:ci)" = '[/opt/hermes/docker/entrypoint-dispatch.sh]'
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python allies/hermes-mnemosyne:ci \
            -c 'from plugins.memory import load_memory_provider; p=load_memory_provider("allies_mnemosyne"); assert p is not None; p.initialize("smoke-session", hermes_home="/tmp/ally-smoke", profile_root="/tmp/ally-smoke", agent_identity="ally-v1-00000000000000000000000000000001", agent_context="conversation", memory_mode="context_only", tools=[]); assert p.status()["available"] is True; assert p.get_tool_schemas() == []; assert p._delegate._beam.conn.execute("PRAGMA busy_timeout").fetchone()[0] == 5000; print(p.status()); p.shutdown()'
      - name: Boot with a fresh root-owned volume
        run: sh runtime/hermes-image/smoke_volume_boot.sh allies/hermes-mnemosyne:ci
      - name: Prove publication bridge socket permissions
        run: sh runtime/hermes-image/smoke_file_publication_socket.sh allies/hermes-mnemosyne:ci
      - name: Verify native skill discovery and learning across restart
        run: sh runtime/hermes-image/smoke_skills.sh allies/hermes-mnemosyne:ci
      - name: Verify managed reasoning request precedence
        run: |
          docker run --rm \
            --entrypoint /opt/hermes/.venv/bin/python \
            --volume "$PWD/runtime/hermes-image/smoke_reasoning_override.py:/tmp/smoke-reasoning.py:ro" \
            allies/hermes-mnemosyne:ci \
            /tmp/smoke-reasoning.py
      - name: Exercise first-turn transcript bootstrap
        run: |
          docker run --rm \
            --entrypoint /opt/hermes/.venv/bin/python \
            --volume "$PWD/runtime/hermes-image/smoke_bootstrap_endpoint.py:/tmp/smoke-bootstrap.py:ro" \
            allies/hermes-mnemosyne:ci \
            /tmp/smoke-bootstrap.py
      - name: Exercise correlated activity SSE
        run: |
          docker run --rm \
            --entrypoint /opt/hermes/.venv/bin/python \
            --volume "$PWD/runtime/hermes-image/smoke_activity_stream.py:/tmp/smoke-activity.py:ro" \
            allies/hermes-mnemosyne:ci \
            /tmp/smoke-activity.py
      - name: Exercise rich Hermes approval SSE and resolver
        run: |
          docker run --rm \
            --entrypoint /opt/hermes/.venv/bin/python \
            --volume "$PWD/runtime/hermes-image/smoke_approval_endpoint.py:/tmp/smoke-approval.py:ro" \
            allies/hermes-mnemosyne:ci \
            /tmp/smoke-approval.py
      - name: Log in to GHCR for manual publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish tested Hermes image
        id: publish_hermes
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${IMAGE_OWNER,,}/allies-hermes"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --push \
            --metadata-file /tmp/hermes-publish.json \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --tag "$image:$GITHUB_SHA" \
            --file runtime/hermes-image/Dockerfile \
            runtime/hermes-image
          digest=$(jq -er '."containerimage.digest"' /tmp/hermes-publish.json)
          reference="$image@$digest"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Published image: $reference"
          {
            echo '## Published Hermes image'
            echo
            echo '```text'
            echo "HERMES_IMAGE=$reference"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish runtime image
        if: github.event_name == 'workflow_dispatch'
        id: publish_runtime
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${IMAGE_OWNER,,}/allies-runtime"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --load \
            --tag allies-runtime:ci \
            --file runtime/Dockerfile \
            runtime
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' allies-runtime:ci)" = '["python","-m","allies_runtime"]'
          docker run --rm --entrypoint python allies-runtime:ci -c 'import allies_runtime'
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --push \
            --metadata-file /tmp/runtime-publish.json \
            --tag "$image:$GITHUB_SHA" \
            --file runtime/Dockerfile \
            runtime
          digest=$(jq -er '."containerimage.digest"' /tmp/runtime-publish.json)
          reference="$image@$digest"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Published image: $reference"
          {
            echo
            echo '## Published runtime image'
            echo
            echo '```text'
            echo "RUNTIME_IMAGE=$reference"
            echo '```'
            echo
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  update-railway:
    name: Update Foundry ${{ inputs.railway_environment }} images
    if: github.event_name == 'workflow_dispatch' && (inputs.railway_environment == 'staging' || inputs.railway_environment == 'production')
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: publish-runtime-images-${{ inputs.railway_environment }}
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      TARGET_ENVIRONMENT: ${{ inputs.railway_environment }}
      HERMES_IMAGE: ${{ needs.build.outputs.hermes_image }}
      RUNTIME_IMAGE: ${{ needs.build.outputs.runtime_image }}
    steps:
      - name: Update shared image variables
        run: |
          set -euo pipefail
          : "${RAILWAY_API_TOKEN:?RAILWAY_TOKEN secret is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID variable is required}"
          environment_query=$(jq -cn \
            --arg project "$RAILWAY_PROJECT_ID" \
            '{query:"query($id: String!) { project(id: $id) { environments { edges { node { id name } } } } }",variables:{id:$project}}')
          environment_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$environment_query" \
            https://backboard.railway.com/graphql/v2)
          if ! environment_id=$(jq -er --arg target "$TARGET_ENVIRONMENT" '
            if ((.errors // []) | length) > 0 then
              error((.errors | map(.message) | join("; ")))
            else
              .data.project.environments.edges[]
              | select(.node.name == $target)
              | .node.id
            end
          ' <<< "$environment_response"); then
            echo "Unable to resolve Railway environment: $TARGET_ENVIRONMENT" >&2
            exit 1
          fi
          variables_mutation=$(jq -cn \
            --arg project "$RAILWAY_PROJECT_ID" \
            --arg environment "$environment_id" \
            --arg hermes "$HERMES_IMAGE" \
            --arg runtime "$RUNTIME_IMAGE" \
            '{query:"mutation($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }",variables:{input:{projectId:$project,environmentId:$environment,variables:{HERMES_IMAGE:$hermes,RUNTIME_IMAGE:$runtime}}}}')
          variables_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$variables_mutation" \
            https://backboard.railway.com/graphql/v2)
          if jq -e '((.errors // []) | length) > 0' <<< "$variables_response" >/dev/null; then
            echo "Railway rejected the shared image variable update:" >&2
            jq -r '.errors[]?.message' <<< "$variables_response" >&2
            exit 1
          fi
          test "$(jq -er '.data.variableCollectionUpsert' <<< "$variables_response")" = true
          {
            echo
            echo "## Railway"
            echo
            echo "Updated Foundry **$TARGET_ENVIRONMENT** shared image variables."
          } >> "$GITHUB_STEP_SUMMARY"
