name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "services/cloud/**"
      - ".github/workflows/cloud.yml"
  push:
    branches: [main]
    paths:
      - "services/cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  check:
    name: Django checks and tests
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.record_source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Record validated source SHA
        id: record_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: services/cloud/backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: services/cloud/backend
        run: uv sync --locked

      - name: Check lockfile
        working-directory: services/cloud/backend
        run: uv lock --check

      - name: Run Django checks
        working-directory: services/cloud/backend
        run: uv run python manage.py check

      - name: Check for missing migrations
        working-directory: services/cloud/backend
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: services/cloud/backend
        run: uv run python manage.py migrate --noinput

      - name: Verify migrations are applied
        working-directory: services/cloud/backend
        run: uv run python manage.py migrate --check

      - name: Run tests
        working-directory: services/cloud/backend
        run: uv run pytest

      - name: Enforce AUTH-001 domain coverage
        working-directory: services/cloud/backend
        run: uv run pytest --cov=auths --cov=workspaces --cov-fail-under=90

      - name: Run Ruff lint
        working-directory: services/cloud/backend
        run: uv run ruff check .

      - name: Check Ruff formatting
        working-directory: services/cloud/backend
        run: uv run ruff format --check .

  postgresql-auth:
    name: PostgreSQL UUID schema and concurrency
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: allies_cloud_test
          POSTGRES_USER: allies
          POSTGRES_PASSWORD: allies-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allies -d allies_cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://allies:allies-ci-only@127.0.0.1:5432/allies_cloud_test
      DJANGO_DEBUG: "true"
      ALLIES_AUTH_FAKE_PROVIDER_ENABLED: "true"
      ALLIES_AUTH_JWT_KEY: auth-ci-jwt-key-at-least-thirty-two-bytes
      ALLIES_AUTH_DIGEST_KEY: auth-ci-digest-key-at-least-thirty-two-bytes
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: services/cloud/backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: services/cloud/backend
        run: uv sync --locked

      - name: Apply fresh PostgreSQL migrations
        working-directory: services/cloud/backend
        run: uv run python manage.py migrate --noinput

      - name: Verify PostgreSQL migration state
        working-directory: services/cloud/backend
        run: uv run python manage.py migrate --check

      - name: Verify UUID-native schema contract
        working-directory: services/cloud/backend
        run: uv run pytest config/tests/test_uuid_schema.py

      - name: Run PostgreSQL concurrency tests
        working-directory: services/cloud/backend
        run: uv run pytest -m postgresql

      - name: Run PostgreSQL file lifecycle regressions
        working-directory: services/cloud/backend
        run: uv run pytest files/tests
