name: CI

on:
  pull_request:
    branches: [dev, staging, prod, prod-fastlane]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    outputs:
      source_sha:
        description: "The exact source commit checked by this workflow"
        value: ${{ jobs.quality.outputs.source_sha }}

permissions:
  contents: read

jobs:
  quality:
    name: Interface foundation checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      NEXT_PUBLIC_CLOUD_API_URL: https://cloud.invalid
      EXPO_PUBLIC_CLOUD_API_URL: https://cloud.invalid
    outputs:
      source_sha: ${{ steps.record_source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Record validated source SHA
        id: record_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify pinned Cloud contract
        run: bun run cloud:check
      - name: Type check workspaces
        run: bun run typecheck
      - name: Run focused tests
        run: bun run test:run
      - name: Lint web and mobile
        run: bun run lint
      - name: Build web
        run: bun run build:web
      - name: Export mobile iOS bundle
        run: bun run bundle:mobile
