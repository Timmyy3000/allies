name: CI

on:
  pull_request:
    branches: [dev, staging, prod, prod-fastlane]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    outputs:
      source_sha:
        description: "The exact source commit checked by this workflow"
        value: ${{ jobs.quality.outputs.source_sha }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint and web build
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.record_source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Record validated source SHA
        id: record_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint web and mobile
        run: bun run lint
      - name: Build web
        run: bun run build:web
