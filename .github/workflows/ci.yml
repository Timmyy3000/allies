name: CI

on:
  pull_request:
    branches: [dev, staging, prod, prod-fastlane, web/feat/chat-frames]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    outputs:
      source_sha:
        description: "The exact source commit checked by this workflow"
        value: ${{ jobs.quality.outputs.source_sha }}

permissions:
  contents: read

jobs:
  quality:
    name: Interface CI suite
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      NEXT_PUBLIC_CLOUD_API_URL: https://cloud.invalid
      EXPO_PUBLIC_CLOUD_API_URL: https://cloud.invalid
      CHAT_FRAMES_PORT: 3011
    outputs:
      source_sha: ${{ steps.record_source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Record validated source SHA
        id: record_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify pinned Cloud contract
        run: bun run cloud:check
      - name: Type check workspaces
        run: bun run typecheck
      - name: Run focused tests
        run: bun run test:run
      - name: Lint web and mobile
        run: bun run lint
      - name: Build web
        run: bun run build:web
      - name: Install pinned Playwright browsers
        run: bun --cwd apps/web playwright install --with-deps chromium webkit firefox
      - name: Verify Ally SVG playback in Chromium and WebKit
        run: bun run --cwd apps/web test:ally-motion
      - name: Run chat frame regression tests
        id: chat_frames
        run: bun run test:chat-frames
      - name: Validate chat frame artifacts
        if: ${{ always() && steps.chat_frames.outcome != 'skipped' }}
        working-directory: apps/web
        shell: bash
        run: |
          test -d playwright-report/chat-frames
          test -d test-results/chat-frames
          test -s test-output/chat-frames/summary.json
          test -d tests/chat-frames/__screenshots__/chat-chromium
          baseline_count="$(find tests/chat-frames/__screenshots__/chat-chromium -type f -name '*.png' | wc -l)"
          test "$baseline_count" -eq 25
      - name: Upload chat frame evidence
        if: ${{ always() && steps.chat_frames.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: chat-frame-regression-evidence
          path: |
            apps/web/playwright-report/chat-frames
            apps/web/test-results/chat-frames
            apps/web/test-output/chat-frames/summary.json
            apps/web/tests/chat-frames/__screenshots__/chat-chromium
          if-no-files-found: error
          retention-days: 30
      - name: Export mobile iOS bundle
        run: bun run bundle:mobile
