<svg xmlns="http://www.w3.org/2000/svg" width="470" height="470" viewBox="0 0 470 470" fill="none" role="img" aria-label="Sleeping ghosty">
<title>Sleeping ghosty</title>
<style>
@keyframes sleep-breathe {
  0%,100% { transform: translateY(0px) scale(1,1); }
  16% { transform: translateY(9px) scale(1.018,.975); }
  30% { transform: translateY(-8px) scale(.977,1.035); }
  58% { transform: translateY(4px) scale(1.008,.99); }
}
.sleeper { transform-origin: 235px 330px; animation: sleep-breathe 4.8s cubic-bezier(.37,0,.63,1) infinite; }
@keyframes sleep-eyes {
  0%,100% { transform: translateY(0px); }
  16% { transform: translateY(8px); }
  30% { transform: translateY(-21px); }
  58% { transform: translateY(3px); }
}
.sleep-eyelids { animation: sleep-eyes 4.8s cubic-bezier(.37,0,.63,1) infinite; }
@keyframes eyelid-curve {
  0%,100% { d:path('M 2 48 Q 27 69 53 48'); }
  16% { d:path('M 2 48 Q 27 65 53 48'); }
  30% { d:path('M 2 48 Q 27 39 53 48'); }
  58% { d:path('M 2 48 Q 27 67 53 48'); }
}
.lid { fill:black; stroke:none; }
.rocker { transform-origin:235px 320px; animation:sleep-rock 9.6s linear infinite; }
.sleep-z { animation: sleep-z-travel 3.6s linear infinite, sleep-z-fade 3.6s linear infinite; }
.z-two { animation-delay:-1.2s; }
.z-three { animation-delay:-2.4s; }
@keyframes sleep-z-travel {
  from { transform:translate(300px,135px) rotate(-8deg) scale(.55); }
  to { transform:translate(375px,48px) rotate(5deg) scale(1.15); }
}
@keyframes sleep-z-fade {
  0%,100% { opacity:0; }
  18%,65% { opacity:1; }
}
@media (prefers-reduced-motion: reduce) {
  .sleeper,.sleep-eyelids,.rocker,.lid { animation:none; }
  .sleep-z { animation:none; opacity:1; transform:translate(302px,103px) scale(.58); }
  .z-two { transform:translate(341px,70px) scale(.86); }
  .z-three { transform:translate(386px,96px) scale(1.13); }
}
