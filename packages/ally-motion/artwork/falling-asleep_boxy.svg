<svg xmlns="http://www.w3.org/2000/svg" width="470" height="470" viewBox="0 0 470 470" fill="none" role="img" aria-label="Falling asleep boxy">
<title>Falling asleep boxy</title><style>
@keyframes wake-head {
  0% { transform:rotate(-1deg) translateY(0px) scale(1); }
  38% { transform:rotate(1.5deg) translateY(-7px) scale(.99,1.02); }
  100% { transform:rotate(0deg) translateY(0px) scale(1); }
}
@keyframes wake-open {
  0%,12% { d:path('M27.463 52 C38 52 48 43 54 44 C60 53 41 65 27.463 65 C13 65 -6 53 0 44 C6 43 16 52 27.463 52 Z'); }
  100% { d:path('M27.463 0 C42.6315 0 54.926 21.1764 54.926 47.2929 C54.926 73.4094 42.6315 94.5858 27.463 94.5858 C12.2946 94.5858 0 73.4094 0 47.2929 C0 21.1764 12.2946 0 27.463 0 Z'); }
}
@keyframes wake-pupil {
  0%,20% { opacity:0; }
  75%,100% { opacity:1; }
}
@keyframes wake-z-one {
  0% { transform:translate(335px,108.333px) rotate(-3.667deg) scale(.58333); opacity:1; }
  65%,100% { transform:translate(362px,76px) rotate(-.3deg) scale(.803); opacity:0; }
}
@keyframes wake-z-two {
  0% { transform:translate(370px,66.667px) rotate(.667deg) scale(.86667); opacity:.95238; }
  85%,100% { transform:translate(405px,25px) rotate(5deg) scale(1.15); opacity:0; }
}
.head { transform-origin:235px 320px; animation:wake-head 1.4s cubic-bezier(.37,0,.63,1) both; }
.eye-shape { animation:wake-open 1.4s cubic-bezier(.37,0,.63,1) both; }
.pupil { animation:wake-pupil 1.4s ease-in-out both; }
.z-one { animation:wake-z-one 1.4s linear both; }
.z-two { animation:wake-z-two 1.4s linear both; }
@media (prefers-reduced-motion:reduce) {
  .head,.eye-shape,.pupil { animation:none; }
  .z-one,.z-two { animation:none; opacity:0; }
}

.head,.eye-shape,.pupil { animation-direction:reverse; } .z-one,.z-two { animation:none; opacity:0; }</style>
